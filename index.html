<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4F1" />
    <!-- 整站只有浅色一套：声明一下，免得系统开了暗色时表单控件、滚动条被 UA 涂成深色 -->
    <meta name="color-scheme" content="light" />
    <title>夏祭 · 个人主页</title>
    <meta
      name="description"
      content="夏祭的个人主页 — 编程爱好者。真理会过时，构石永恒。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23F5F4F1'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%23111111'/%3E%3C/svg%3E"
    />
    <!--
      字体：Inter（标题/正文） + JetBrains Mono（小字标签）
      如果打不开 Google Fonts（比如国内网络），页面会自动回退到系统字体，
      不会出现排版崩坏；想彻底去掉这个请求，把下面三行删掉即可。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      刷新时浏览器会恢复上次的滚动位置。如果刷新时人停在页面中间，开场那团点
      会被"滚动进度"整片淡掉 —— 加载界面上就一颗点都看不见。
      所以刷新一律从顶部开始。（只认刷新：前进 / 后退仍然保留浏览器的位置恢复，
      用带 #锚点 的地址打开也照常跳到锚点。）
    -->
    <script>
      ;(function () {
        var type = 'reload'
        try {
          var nav = performance.getEntriesByType('navigation')
          if (nav && nav[0] && nav[0].type) type = nav[0].type
        } catch (e) {
          /* 取不到就按刷新处理 */
        }
        if (type !== 'reload') return
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
          window.scrollTo(0, 0)
        } catch (e) {
          /* 不支持也没关系，ParticleMountain.jsx 里还有一道兜底 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
