<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F4F1" />
    <!-- 整站只有浅色一套：声明一下，免得系统开了暗色时表单控件、滚动条被 UA 涂成深色 -->
    <meta name="color-scheme" content="light" />
    <!-- PWA：可以"安装"到桌面 / 主屏（manifest 与图标在 public/，路径用相对地址，
         放子路径部署也不会指错）-->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- 社交分享预览：分享到微信 / Telegram / Twitter 时带标题、描述和图。
         og:image 必须是绝对地址 —— 换成你的实际域名（图在 public/og-cover.png，
         1200×630，就是首屏那张点阵山的实拍）-->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Name · 个人主页" />
    <meta
      property="og:description"
      content="黑白点阵风格的个人主页 —— 首屏那座山是浏览器现场算出来的。"
    />
    <meta property="og:image" content="https://example.com/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Your Name · 个人主页</title>
    <meta
      name="description"
      content="Your Name 的个人主页 —— 黑白点阵风格，首屏那座山由算法现场算出。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23F5F4F1'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%23111111'/%3E%3C/svg%3E"
    />
    <!--
      字体：Inter（标题/正文） + JetBrains Mono（小字标签）
      如果打不开 Google Fonts（比如国内网络），页面会自动回退到系统字体，
      不会出现排版崩坏；想彻底去掉这个请求，把下面三行删掉即可。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      刷新时浏览器会恢复上次的滚动位置。如果刷新时人停在页面中间，开场那团点
      会被"滚动进度"整片淡掉 —— 加载界面上就一颗点都看不见。
      所以刷新一律从顶部开始。（只认刷新：前进 / 后退仍然保留浏览器的位置恢复，
      用带 #锚点 的地址打开也照常跳到锚点。）
      脚本在 public/scroll-restoration.js：CSP（script-src 'self'）不允许内联。
    -->
    <script src="scroll-restoration.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
