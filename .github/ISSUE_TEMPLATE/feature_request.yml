name: Feature request
description: 提一个新功能或改进想法
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说清楚痛点，再说方案。
      placeholder: 例如：手机上便签墙一列太长，希望改成两列。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的方案
      placeholder: 描述一下你想象中的效果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 涉及范围
      options:
        - label: 视觉 / 排版
        - label: 动效
        - label: 内容文案
        - label: 工程配置 / 部署
        - label: 无障碍或性能
